# Render Blueprint for the Spring Boot backend (the React frontend is deployed on Vercel).
services:
  - type: web
    name: currency-exchange-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: "8080"
      # H2 file database inside the container; it resets on each redeploy/restart.
      # For persistent data, remove this and set DB_URL / DB_USERNAME / DB_PASSWORD for a MySQL server.
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: DEMO_DATA_ENABLED
        value: "true"
      - key: EXCHANGE_RATE_API_KEY
        sync: false

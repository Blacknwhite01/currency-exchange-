spring.application.name=currency-exchange
server.port=8080

# --- Database (MySQL baseline) -------------------------------------------
# Credentials come from environment variables so they never live in version control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/currency_exchange?createDatabaseIfNotExist=true&serverTimezone=UTC&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# --- Exchange-rate provider ----------------------------------------------
# Leave EXCHANGE_RATE_API_KEY empty to use ExchangeRate-API's keyless open-access endpoint.
app.provider.api-key=${EXCHANGE_RATE_API_KEY:}
app.provider.keyed-base-url=https://v6.exchangerate-api.com/v6
app.provider.open-base-url=https://open.er-api.com/v6
app.provider.timeout=10s
# Snapshots are always stored relative to this currency; other pairs are cross-calculated.
app.provider.storage-base=USD
# Minimum wait before retrying the provider after a failed request.
app.provider.retry-after-failure=5m
# Periodic check; a request is only sent when the provider's next-update time has passed.
app.refresh.cron=0 5 * * * *

# --- Demo data -------------------------------------------------------------
# Seeds clearly labelled synthetic history so charts can be demonstrated immediately.
# Demo points are stored with source=DEMO and are flagged everywhere in the API and UI.
app.demo.enabled=${DEMO_DATA_ENABLED:true}
app.demo.days=365

# --- CORS ------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
